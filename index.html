<title>Honda Seguros — Protótipo do Assistente Virtual</title>
<style>
  :root{--honda-red:#E2231A;--honda-dark-red:#B81B14;--honda-orange:#F39200;--bg:#f3f1ef;--card-bg:#fff;--text:#2b2b2b;--muted:#6b6b6b;--note-bg:#fff6e6;--note-border:#f0c36d;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(180deg,#f6f4f2 0%,#eceae7 100%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  header{width:100%;background:linear-gradient(90deg,var(--honda-red),var(--honda-dark-red));color:#fff;padding:18px 24px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  header .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--honda-red);font-size:18px;}
  header .titles h1{margin:0;font-size:18px;font-weight:700;}
  header .titles p{margin:0;font-size:12px;opacity:.9;}
  .phone-frame{width:420px;max-width:94vw;margin:24px auto 16px;background:#111;border-radius:34px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .screen{background:var(--bg);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;height:720px;max-height:80vh;position:relative;}
  .assistant-bar{background:var(--honda-red);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .assistant-bar .avatar{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--honda-red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
  .assistant-bar .info b{display:block;font-size:14px;}
  .assistant-bar .info span{font-size:11px;opacity:.9;}
  .breadcrumb{font-size:11px;color:var(--muted);padding:8px 16px 0;flex-shrink:0;line-height:1.5;}
  .chat-area{flex:1;overflow-y:auto;padding:14px 16px 10px;display:flex;flex-direction:column;gap:12px;}
  .chat-area::-webkit-scrollbar{width:6px;}
  .chat-area::-webkit-scrollbar-thumb{background:#d0cdc9;border-radius:3px;}
  .bot-msg{align-self:flex-start;max-width:88%;display:flex;gap:8px;}
  .bot-msg .bubble{background:var(--card-bg);border-radius:4px 14px 14px 14px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:13.5px;line-height:1.5;white-space:pre-line;}
  .bot-msg .bubble h3{margin:0 0 6px;font-size:14.5px;color:var(--honda-red);}
  .bot-msg .mini-avatar{width:26px;height:26px;border-radius:50%;background:var(--honda-orange);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}
  .note-box{margin-top:8px;background:var(--note-bg);border:1px solid var(--note-border);border-radius:8px;padding:8px 10px;font-size:12px;color:#7a5b00;}
  .user-msg{align-self:flex-end;max-width:80%;background:linear-gradient(135deg,var(--honda-orange),#ff7a00);color:#fff;padding:9px 13px;border-radius:14px 4px 14px 14px;font-size:13.5px;box-shadow:0 1px 4px rgba(0,0,0,.1);}
  .options-card{align-self:flex-start;max-width:94%;display:flex;flex-wrap:wrap;gap:8px;margin-left:34px;}
  .option-btn{background:#fff;border:1.5px solid var(--honda-red);color:var(--honda-red);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease;}
  .option-btn:hover{background:var(--honda-red);color:#fff;transform:translateY(-1px);}
  .footer-bar{flex-shrink:0;display:flex;gap:8px;padding:10px 16px 16px;background:var(--bg);border-top:1px solid #e3e0dc;}
  .nav-btn{flex:1;padding:10px 8px;border-radius:10px;border:none;font-size:12.5px;font-weight:700;cursor:pointer;transition:opacity .15s;}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;}
  .nav-btn.back{background:#e7e4e0;color:#444;}
  .nav-btn.restart{background:var(--honda-dark-red);color:#fff;}
  .hint{text-align:center;color:var(--muted);font-size:12.5px;max-width:420px;margin:0 auto 24px;padding:0 20px;}
</style>
</head>

<header>
  <div class="logo">H</div>
  <div class="titles">
    <h1>Honda Seguros — Protótipo de Cards</h1>
    <p>Simulação da jornada do assistente virtual a partir do fluxograma</p>
  </div>
</header>

<div class="phone-frame">
  <div class="screen">

    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="chat-area" id="chatArea"></div>
    <div class="footer-bar">
      <button class="nav-btn back" id="btnBack">◀ Voltar</button>
      <button class="nav-btn restart" id="btnRestart">⟲ Menu inicial</button>
    </div>
  </div>
</div>
<p class="hint">Clique nas opções para navegar pelo fluxo, como o cliente veria no atendimento.</p>

<script>
const FLOW = JSON.parse(document.getElementById('flow-data').textContent);
const chatArea = document.getElementById('chatArea');
const breadcrumbEl = document.getElementById('breadcrumb');
const btnBack = document.getElementById('btnBack');
const btnRestart = document.getElementById('btnRestart');
let history = [];
let current = 'root';
let crumbLabels = ['Início'];

function escapeHtml(str){const d=document.createElement('div');d.textContent=str;return d.innerHTML;}

function renderNode(nodeId, viaLabel){
  const node = FLOW[nodeId];
  if(!node) return;
  current = nodeId;
  if(viaLabel){
    const u = document.createElement('div');
    u.className = 'user-msg';
    u.textContent = viaLabel;
    chatArea.appendChild(u);
  }
  appendBotCard(node);
  updateUI();
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendBotCard(node){
  const wrap = document.createElement('div');
  wrap.className = 'bot-msg';
  const avatar = document.createElement('div');
  avatar.className = 'mini-avatar';
  avatar.textContent = 'H';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  let html = '';
  if(node.title) html += `<h3>${escapeHtml(node.title)}</h3>`;
  html += `<div>${escapeHtml(node.message || node.final || '')}</div>`;
  if(node.note) html += `<div class="note-box">ℹ️ ${escapeHtml(node.note)}</div>`;
  bubble.innerHTML = html;
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chatArea.appendChild(wrap);

  const optWrap = document.createElement('div');
  optWrap.className = 'options-card';
  if(node.options && node.options.length){
    node.options.forEach(opt=>{
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt.label;
      btn.onclick = ()=>{
        history.push(current);
        crumbLabels.push(opt.label);
        renderNode(opt.next, opt.label);
      };
      optWrap.appendChild(btn);
    });
  } else {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = '⟲ Voltar ao menu inicial';
    btn.onclick = resetAll;
    optWrap.appendChild(btn);
  }
  chatArea.appendChild(optWrap);
}

function updateUI(){
  breadcrumbEl.textContent = crumbLabels.join(' › ');
  btnBack.disabled = history.length === 0;
  btnRestart.disabled = history.length === 0;
}

function goBack(){
  if(history.length === 0) return;
  const prev = history.pop();
  crumbLabels.pop();
  chatArea.removeChild(chatArea.lastChild);
  chatArea.removeChild(chatArea.lastChild);
  if(chatArea.lastChild && chatArea.lastChild.classList.contains('user-msg')) chatArea.removeChild(chatArea.lastChild);
  current = prev;
  updateUI();
}

function resetAll(){
  history = [];
  crumbLabels = ['Início'];
  chatArea.innerHTML = '';
  current = 'root';
  appendBotCard(FLOW['root']);
  updateUI();
}

btnBack.addEventListener('click', goBack);
btnRestart.addEventListener('click', resetAll);
resetAll();
</script>
